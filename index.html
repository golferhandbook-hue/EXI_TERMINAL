<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Daily Insights & Stock Reports Portal</title>
  
  <!-- 구글 폰트: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Markdown 렌더링 파서 (Marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- 폰트어썸 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(22, 30, 49, 0.6);
      --bg-card-hover: rgba(33, 45, 74, 0.8);
      --border-glow: rgba(0, 242, 254, 0.15);
      --border-light: rgba(255, 255, 255, 0.08);
      --primary-cyan: #00f2fe;
      --primary-blue: #4facfe;
      --accent-purple: #7f00ff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(127, 0, 255, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* 헤더 & 네비게이션 */
    header {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .logo i {
      color: var(--primary-cyan);
      -webkit-text-fill-color: initial;
      font-size: 1.5rem;
    }

    .badge-live {
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--primary-cyan);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-live::before {
      content: '';
      width: 6px;
      height: 6px;
      background-color: var(--primary-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary-cyan);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    /* 메인 레이아웃 */
    .app-layout {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 2rem;
      flex: 1;
      width: 100%;
    }

    /* 좌측 사이드바 리포트 목록 */
    .sidebar {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      height: calc(100vh - 140px);
      position: sticky;
      top: 90px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }

    .report-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .report-list::-webkit-scrollbar {
      width: 4px;
    }

    .report-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .report-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .report-item:hover, .report-item.active {
      background: var(--bg-card-hover);
      border-color: var(--primary-cyan);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .report-item .date {
      font-size: 0.75rem;
      color: var(--primary-cyan);
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .report-item .title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 우측 리포트 상세 본문 */
    .content-area {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 2.5rem;
      min-height: calc(100vh - 140px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* 마크다운 렌더링 세부 스타일 */
    .markdown-body h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1.2rem;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.8rem;
    }

    .markdown-body h2 {
      font-size: 1.35rem;
      color: var(--primary-cyan);
      margin: 1.8rem 0 1rem 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .markdown-body h3 {
      font-size: 1.1rem;
      color: var(--primary-blue);
      margin: 1.2rem 0 0.6rem 0;
    }

    .markdown-body p {
      margin-bottom: 1rem;
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-left: 1.5rem;
      margin-bottom: 1.2rem;
      color: var(--text-muted);
    }

    .markdown-body li {
      margin-bottom: 0.4rem;
    }

    .markdown-body blockquote {
      background: rgba(0, 242, 254, 0.05);
      border-left: 4px solid var(--primary-cyan);
      border-radius: 0 12px 12px 0;
      padding: 1rem 1.2rem;
      margin: 1.2rem 0;
      color: var(--text-main);
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      border-radius: 12px;
      overflow: hidden;
    }

    .markdown-body th, .markdown-body td {
      padding: 12px 16px;
      border: 1px solid var(--border-light);
      text-align: left;
    }

    .markdown-body th {
      background: rgba(15, 23, 42, 0.8);
      color: var(--primary-cyan);
      font-weight: 600;
    }

    .markdown-body td {
      background: rgba(15, 23, 42, 0.4);
      color: var(--text-muted);
    }

    /* 푸터 */
    footer {
      border-top: 1px solid var(--border-light);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: auto;
    }

    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        height: auto;
        position: relative;
        top: 0;
      }
    }
  </style>
</head>
<body>

  <!-- 🚀 탑 헤더 -->
  <header>
    <div class="header-container">
      <a href="#" class="logo">
        <i class="fa-solid fa-brain-circuit"></i>
        <span>APEX AI INSIGHTS</span>
      </a>
      <div class="badge-live">
        DAILY AUTO UPDATED
      </div>
    </div>
  </header>

  <!-- 📊 메인 앱 레이아웃 -->
  <div class="app-layout">
    
    <!-- 📂 좌측 리포트 검색 및 목록 -->
    <aside class="sidebar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="날짜 또는 종목 검색..." onkeyup="filterReports()" />
      </div>

      <ul class="report-list" id="reportList">
        <!-- 리포트 목록이 JavaScript에 의해 동적으로 로드됩니다 -->
      </ul>
    </aside>

    <!-- 📄 우측 마크다운 문서 상세 출력 영역 -->
    <main class="content-area">
      <article class="markdown-body" id="reportViewer">
        <div style="text-align: center; padding: 4rem 1rem; color: var(--text-dim);">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-cyan); margin-bottom: 1rem;"></i>
          <p>AI 리포트 데이터를 로딩하고 있습니다...</p>
        </div>
      </article>
    </main>

  </div>

  <footer>
    © 2026 Apex AI Automation Terminal. All rights reserved.
  </footer>

  <script>
    // 💡 [등록된 AI 리포트 샘플 목록]
    // AI 자동 배포 스크립트가 리포트를 푸시할 때 아래 목록에 추가되거나 마크다운 파일을 로드합니다.
    const sampleReports = [
      {
        id: "2026-08-21_005930",
        date: "2026-08-21",
        title: "삼성전자(005930) 스윙 AI 매도/익절 자문 분석",
        content: `
# 📊 삼성전자(005930) 일자별 AI 종합 피벗 리포트
> **분석 시각**: 2026-08-21 09:30 KST  
> **종합 의견 점수**: **78점** (매수 우위 / 추세 홀딩)

---

## 🎯 1. AI 핵심 진단 (Verdict)
- **최종 판정**: \`HOLD_FOR_MORE\` (추세 유지 및 목표가 순항 중)
- **핵심 인디케이터**:
  - RSI: **64.2** (과매수 진입 직전, 수급 양호)
  - MACD Histogram: **+2.45** (상승 파동 지속)
  - 차트 목표가: **88,500원** (+5.2%)
  - 차트 손절가: **79,000원** (-2.1%)

---

## 📈 2. 수급 및 기관 동향 분석
| 구분 | 외국인 (Foreign) | 기관 (Institution) | 개인 (Retail) |
| :--- | :--- | :--- | :--- |
| **순매수** | **+1,250,000주** | **+450,000주** | -1,700,000주 |
| **체결강도** | **142%** | **양호** | 이탈 |

---

## 💡 3. Deep AI Insights
1. **외국인 연속 순매수 전환**: HBM3e 공급망 안정화에 따른 수급 유입.
2. **익절 권장 구간**: 88,000원 부근 도달 시 50% 분할 익절 전략 권장.
`
      },
      {
        id: "2026-08-20_000660",
        date: "2026-08-20",
        title: "SK하이닉스(000660) 목표가 달성 및 익절 자문",
        content: `
# 📊 SK하이닉스(000660) AI 전략 분석 리포트
> **분석 시각**: 2026-08-20 15:10 KST  
> **종합 의견 점수**: **85점** (목표가 도달 / 분할 익절)

## 🎯 1. 주요 지표
- **목표가 도달**: **215,000원** (+12.4% 달성)
- **AI 권장 액션**: \`TAKE_PROFIT_NOW\` (50% 분할 수익 확정)
`
      }
    ];

    // 초기 화면 로드
    window.addEventListener('DOMContentLoaded', () => {
      renderReportList(sampleReports);
      if (sampleReports.length > 0) {
        selectReport(sampleReports[0].id);
      }
    });

    // 리포트 사이드바 목록 출력
    function renderReportList(list) {
      const listEl = document.getElementById('reportList');
      listEl.innerHTML = list.map((item, idx) => `
        <li class="report-item ${idx === 0 ? 'active' : ''}" id="item-${item.id}" onclick="selectReport('${item.id}')">
          <div class="date"><i class="fa-regular fa-calendar-check"></i> ${item.date}</div>
          <div class="title">${item.title}</div>
        </li>
      `).join('');
    }

    // 특정 리포트 선택 시 마크다운 렌더링
    function selectReport(id) {
      document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${id}`);
      if (activeEl) activeEl.classList.add('active');

      const target = sampleReports.find(r => r.id === id);
      if (target) {
        const viewerEl = document.getElementById('reportViewer');
        // Marked 파서를 이용해 마크다운 텍스트를 HTML로 변환
        viewerEl.innerHTML = marked.parse(target.content);
      }
    }

    // 날짜 / 제목 검색 필터링
    function filterReports() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = sampleReports.filter(r => 
        r.date.includes(query) || r.title.toLowerCase().includes(query)
      );
      renderReportList(filtered);
    }
  </script>
</body>
</html>
